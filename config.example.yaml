# KTB Cash Optimization — Unity Catalog / SQL warehouse config
#
# Copy to config.yaml and fill in your own values:
#   cp config.example.yaml config.yaml
#
# config.yaml is gitignored so workspace identifiers stay out of version
# control. Env vars still override whatever is set here, which is how
# Databricks Apps supplies them at runtime (see app.yaml).
#
# Runtime schema and setup order: docs/data/runtime-schema.md

warehouse_id: "<your-sql-warehouse-id>"   # SQL Warehouses -> Connection details -> HTTP path
catalog: "<your-catalog>"
schema: "<your-schema>"
business_date: "auto"   # auto = latest date in fact_cash_position
center_id: "<your-center-id>"
center_name: "<your-center-name>"
use_unity_catalog: true

# ─── Table paths in Unity Catalog (12 runtime tables) ─────────
# Reference inventory only: the backend derives names from catalog/schema;
# it does not read per-table overrides from this mapping.
# Setup and migration order: scripts/README.md. Demo seeds replace data.
tables:
  # Branch
  dim_branch: "<catalog>.<schema>.dim_branch"
  fact_cash_position: "<catalog>.<schema>.fact_cash_position"
  fact_cash_flow_daily: "<catalog>.<schema>.fact_cash_flow_daily"
  fact_branch_denomination: "<catalog>.<schema>.fact_branch_denomination"
  # Machine
  dim_machine: "<catalog>.<schema>.dim_machine"
  fact_machine_position: "<catalog>.<schema>.fact_machine_position"
  fact_machine_denomination: "<catalog>.<schema>.fact_machine_denomination"
  fact_machine_flow_daily: "<catalog>.<schema>.fact_machine_flow_daily"
  # Route
  dim_truck: "<catalog>.<schema>.dim_truck"
  fact_route_summary: "<catalog>.<schema>.fact_route_summary"
  fact_route_stop: "<catalog>.<schema>.fact_route_stop"
  # Configuration
  dim_route_parameter: "<catalog>.<schema>.dim_route_parameter"

# ─── Warehouse pool / read cache tuning (optional) ──────────────────
# Defaults shown. Check the "pool" block on GET /api/v2/health before
# changing these — sustained poolMisses with idle at 0 means pool_size is
# too small for the concurrent fan-out; a low cacheHits:cacheMisses ratio
# means result_cache_ttl_s is shorter than the gap between page loads.
# pool_size 14 holds a measured 12-16 concurrent checkouts from two
# simultaneous users; one user alone only reaches ~6, so don't size off a
# single-user peak. Raise it if more people use the dashboard at once.
# pool_size: 14              # max pooled warehouse connections
# pool_max_age_s: 300        # drop a pooled connection older than this
# result_cache_ttl_s: 180    # memoise reads for this long

# Optional overrides via environment:
#   V2_CATALOG / V2_SCHEMA / V2_WAREHOUSE_ID (used by server/repositories/ and server/warehouse.py)
#   DATABRICKS_WAREHOUSE_ID  (Apps: valueFrom sql-warehouse)
#   APP_POOL_SIZE / APP_POOL_MAX_AGE_S / APP_RESULT_CACHE_TTL_S
