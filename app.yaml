command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

# Fill in the catalog/schema and warehouse id for the workspace you deploy to.
# These are the deployed equivalents of config.yaml, which is gitignored.
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: APP_CATALOG
    value: "<your-catalog>"
  - name: APP_SCHEMA
    value: "<your-schema>"
  - name: APP_BUSINESS_DATE
    value: "auto"
  - name: APP_REGION_CODE
    value: "<your-region-code>"
  - name: USE_UNITY_CATALOG
    value: "true"
  - name: V2_CATALOG
    value: "<your-catalog>"
  - name: V2_SCHEMA
    value: "<your-schema>"
  - name: V2_WAREHOUSE_ID
    valueFrom: "sql-warehouse"

resources:
  - name: "sql-warehouse"
    sql_warehouse:
      id: "<your-sql-warehouse-id>"
      permission: "CAN_USE"
